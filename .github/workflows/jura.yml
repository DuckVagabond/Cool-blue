name: Jura watch
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Coolblue
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import os, re, smtplib, urllib.request
          from email.message import EmailMessage
          url = "https://www.coolblue.nl/jura/black-friday"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36", "Accept-Language": "nl-NL,nl;q=0.9"})
          html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")
          produits = sorted(set(re.findall(r'/product/\d+/[^"\']+\.html', html)))
          print(len(produits), "produits trouvés")
          if produits:
              msg = EmailMessage()
              msg["Subject"] = f"Black Friday Jura chez Coolblue : {len(produits)} produit(s)"
              msg["From"] = msg["To"] = os.environ["GMAIL_USER"]
              msg.set_content(url + "\n\n" + "\n".join("https://www.coolblue.nl" + p for p in produits))
              with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
                  s.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"])
                  s.send_message(msg)
          EOF
